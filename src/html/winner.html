<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Memory</title>
    <link rel="icon" href="../assets/icons/it_logo_favicon.svg" type="image/svg+xml">
    <script type="module" src="/src/main.ts" defer></script>
</head>
<body>
    <div class="content-wrapper content-wrapper--position-winner" id="winner_content">
        <img src="../assets/images/Confetti.png" alt="confetti image" class="confetti-image">
        <div class="winner-container">
            <p class="winner-container__winner-text">The winner is</p>
            <h3 class="winner-container__winner-name winner-container__winner-name--winner-orange" id="winner_name">ORANGE PLAYER</h3>
            <div class="winner-container__winner-svg">
                <img 
                    src="../assets/images/chess_pawn_winner_blue.svg"
                    data-icon-code-vibes-blue="assets/images/chess_pawn_winner_blue.svg" 
                    data-icon-code-vibes-orange="assets/images/chess_pawn_winner_orange.svg" 
                    data-icon-gaming="assets/images/pockal_image.svg" 
                    class="winner-container__winner-svg--orange-player"
                    alt="blue player icon"
                    id="winner_icon">
            </div>
            <a href="../../index.html" class="back-to-start-link">
                <button class="button button__primary button__primary--exit_game" id="exit_game_button">
                    Back to Start
                </button>
            </a>
        </div>
    </div>
</body>
</html>
