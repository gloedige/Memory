<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TS Memory</title>
    <link rel="icon" href="../assets/icons/it_logo_favicon.svg" type="image/svg+xml">
    <script type="module" src="/src/main.ts" defer></script>
</head>
<body>
    <div class="content-wrapper">
        <dialog class="exit-game-dialog" id="dialog">
            <p class="exit-game-dialog__question">Are you shure you want to quit the game?</p>
            <section class="exit-game-dialog__button-section">
                <button class="button button__dialog button__dialog--back-button" 
                    id="back_to_game">
                    Back to Game
                </button>
                <a href="../../index.html">
                    <button class="button button__dialog button__dialog--exit-button"
                        id="exit_game_dialog_btn">
                        Exit Game
                    </button>
                </a>
            </section>
        </dialog>
        <div class="game-board-wrapper">
            <header class="game-board-header">
                <section class="score-board">
                    <div class="score-board__item">
                        <img 
                            src="../assets/icons/label_blue_player.svg" 
                            data-icon-code-vibes="assets/icons/label_blue_player.svg" 
                            data-icon-gaming="assets/icons/chess_pawn_icon_blue_small.svg" 
                            alt="blue player icon">
                        <span class="score-board__item--blue is-hidden">Blue</span>
                        <span class="score-board__item--blue" id="score_blue">0</span>
                    </div>
                    <div class="score-board__item">
                        <img 
                            src="../assets/icons/label_orange_player.svg" 
                            data-icon-code-vibes="assets/icons/label_orange_player.svg" 
                            data-icon-gaming="assets/icons/chess_pawn_icon_orange_small.svg" 
                            alt="orange player icon">
                        <span class="score-board__item--orange is-hidden">Orange</span>
                        <span class="score-board__item--orange" id="score_orange">0</span>
                    </div>
                </section>
                <section class="next-turn" id="next-player-display">
                    <span class="next-turn__player">Current Player:</span>
                    <div class="next-turn__icon-wrapper next-turn__icon-wrapper--blue-background" id="current_player_icon_wrapper">
                        <img 
                            src="../assets/icons/label_blue_player.svg" 
                            class="next-turn__current-player-blue"
                            data-icon-code-vibes="assets/icons/label_blue_player.svg" 
                            data-icon-gaming="assets/icons/chess_pawn_icon_white_small.svg" 
                            alt="blue player">
                        <img 
                            src="../assets/icons/label_orange_player.svg" 
                            class="next-turn__current-player-orange" 
                            data-icon-code-vibes="assets/icons/label_orange_player.svg" 
                            data-icon-gaming="assets/icons/chess_pawn_icon_white_small.svg" 
                            alt="orange player">
                    </div>
                </section>
                <button class="button button__primary button__primary--exit-game" id="exit_game_button">
                    <img src="../assets/icons/exit_game_icon.svg" class="button__primary--controller_icon" alt="exit game icon">
                    Exit Game
                </button>
            </header>
            <section class="field" id="field">
              
            </section>
        </div>
    </div>
    
</body>
</html>
